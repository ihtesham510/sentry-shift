[package]
name = "test-rust"
version = "0.1.0"
edition = "2024"

[dependencies]
dotenvy = '0.15.7'
sqlx = { version = '0.8.0', features = [
  "runtime-tokio",
  "postgres",
  "macros",
  "json",
  "derive",
] }
tokio = { version = '1.53.1', features = ["full"] }
serde = '1.0.229'
serde_json = "1.0.151"
axum = '0.8.9'
axum-extra = { version = "0.12.6", features = ["cookie"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tower-http = { version = "0.7.1", features = ["trace", "fs"] }
better-auth = { version = "0.10.0", features = ["axum", "sqlx-postgres"] }
tokio-cron-scheduler = "0.15.1"
chrono = { version = "0.4.45", features = ["serde"] }
anyhow = "1.0.104"
aws-config = { version = "1.12.0", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1.151.0"
uuid = { version = "1.26.1", features = ["v4", "serde"] }
rand = "0.10.3"
